name: CI
on:
  push:
    branches: [dev]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Go tests and build
        working-directory: backend
        env:
          TEST_DATABASE_URL: host=127.0.0.1 user=tracker password=tracker dbname=tracker_test port=5432 sslmode=disable
        run: |
          go mod tidy
          echo "Go module tidy completed"
          gofmt -l $(find . -name '*.go') > /tmp/unformatted.txt
          cat /tmp/unformatted.txt
          test ! -s /tmp/unformatted.txt
          go test ./... -v
          go vet ./...
          go build ./cmd/server
      - name: JavaScript syntax
        run: node --check frontend/app.js