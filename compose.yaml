name: kai-task-manager
x-app: &app
  build:
    context: .
    target: runtime
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-taskmanager}:${POSTGRES_PASSWORD:-taskmanager}@db:5432/${POSTGRES_DB:-taskmanager}?sslmode=disable
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    GIN_MODE: release
    TZ: Europe/Moscow
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      TZ: Europe/Moscow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_DB: taskmanager_test
      TZ: Europe/Moscow
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://taskmanager:taskmanager@test-db:5432/taskmanager_test?sslmode=disable
      GIN_MODE: release
      TZ: Europe/Moscow
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  postgres-data:
