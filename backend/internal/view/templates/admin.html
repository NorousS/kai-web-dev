{{define "content"}}<div class="page-title"><div><h1>Администрирование</h1><p>Глобальные роли зарегистрированных пользователей.</p></div></div>
<div class="card table-wrap"><table><thead><tr><th>Имя</th><th>Email</th><th>Роль</th><th>Изменить</th></tr></thead><tbody>{{range .Users}}<tr><td>{{.Name}}</td><td>{{.Email}}</td><td>{{role .Role}}</td><td><form method="post" action="/admin/users/{{.ID}}/role" class="inline-form"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><select name="role"><option value="user" {{if eq .Role "user"}}selected{{end}}>Пользователь</option><option value="admin" {{if eq .Role "admin"}}selected{{end}}>Администратор</option></select><button class="button small secondary">Сохранить</button></form></td></tr>{{end}}</tbody></table></div>{{end}}
